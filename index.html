<!DOCTYPE html>
<html>
<head>
    <title>Consilium</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a0f;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 62, 179, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(26, 86, 179, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(15, 52, 96, 0.2) 0%, transparent 70%);
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .layout {
            display: flex;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
        }

        .sidebar {
            width: 0;
            overflow: hidden;
            transition: width 0.3s ease;
            flex-shrink: 0;
        }

        .sidebar.open {
            width: 200px;
            margin-right: 24px;
        }

        .sidebar-inner { width: 200px; }

        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.3);
            margin-bottom: 12px;
        }

        .history-item {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            border-color: rgba(255,255,255,0.15);
        }

        .main { flex: 1; min-width: 0; }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .toggle-btn {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .toggle-btn:hover {
            color: white;
            background: rgba(255,255,255,0.1);
            opacity: 1;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255,255,255,0.35);
            font-size: 14px;
            margin-bottom: 32px;
            margin-left: 46px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        input::placeholder { color: rgba(255,255,255,0.25); }
        input:focus {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
        }

        button {
            background: rgba(255,255,255,0.95);
            color: #000000;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        button:hover { opacity: 0.85; }

        .question-display {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 20px;
            display: none;
        }

        .question-display span { color: rgba(255,255,255,0.6); }

        .ai-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            border-left: 3px solid transparent;
        }

        .ai-card.synthesis {
            background: rgba(251, 191, 36, 0.05);
            border-color: rgba(251, 191, 36, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .ai-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }

        .ai-sublabel {
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.3);
        }

        .ai-badge {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .badge-meta { background: rgba(74, 158, 255, 0.15); color: #4a9eff; }
        .badge-scout { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .badge-openai { background: rgba(192, 132, 252, 0.15); color: #c084fc; }
        .badge-synthesis { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .copy-btn {
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.9);
            opacity: 1;
        }

        .waiting-text {
            font-size: 14px;
            color: rgba(255,255,255,0.2);
            font-style: italic;
        }

        .thinking-indicator {
            display: flex;
            gap: 6px;
            padding: 4px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            animation: dotPulse 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        .ai-content {
            font-size: 15px;
            line-height: 1.7;
            color: rgba(255,255,255,0.75);
        }

        .ai-content p { margin-bottom: 12px; }
        .ai-content p:last-child { margin-bottom: 0; }
        .ai-content strong { color: #ffffff; }
        .ai-content ul, .ai-content ol { padding-left: 20px; margin-bottom: 12px; }
        .ai-content li { margin-bottom: 6px; }
        .ai-content h1, .ai-content h2, .ai-content h3 {
            color: #ffffff;
            margin-bottom: 10px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-title">History</div>
                <div id="history"></div>
            </div>
        </div>

        <div class="main">
            <div class="top-bar">
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
                <h1>Consilium</h1>
            </div>
            <p class="subtitle">Three models debate your question. One synthesizes the answer.</p>

            <div class="input-row">
                <input type="text" id="question" placeholder="Ask anything...">
                <button onclick="ask()">Ask</button>
            </div>

            <div class="question-display" id="questionDisplay">
                Showing results for: <span id="questionText"></span>
            </div>

            <div id="answer"></div>
        </div>
    </div>

    <script>
        const historyList = [];
        const colors = ['#4a9eff','#4ade80','#c084fc','#fbbf24'];

        const models = [
            { key: 'ai1', name: 'LLaMA 3.3', sub: 'Meta', badgeClass: 'badge-meta', badgeText: 'M' },
            { key: 'ai2', name: 'LLaMA Scout', sub: 'Meta', badgeClass: 'badge-scout', badgeText: 'S' },
            { key: 'ai3', name: 'GPT-OSS', sub: 'OpenAI', badgeClass: 'badge-openai', badgeText: 'O' },
            { key: 'synthesis', name: 'Final Synthesis', sub: 'Synthesizer', badgeClass: 'badge-synthesis', badgeText: '⚡', isSynthesis: true },
        ];

        function renderWaitingCards() {
            document.getElementById("answer").innerHTML = models.map((m, i) => `
                <div class="ai-card ${m.isSynthesis ? 'synthesis' : ''}" style="border-left-color: ${colors[i]}">
                    <div class="card-header">
                        <div class="ai-label">
                            <div class="ai-badge ${m.badgeClass}">${m.badgeText}</div>
                            ${m.name} <span class="ai-sublabel">· ${m.sub}</span>
                        </div>
                    </div>
                    <div class="waiting-text">Waiting for your question...</div>
                </div>
            `).join('');
        }

        function showThinkingCards() {
            document.getElementById("answer").innerHTML = models.map((m, i) => `
                <div class="ai-card ${m.isSynthesis ? 'synthesis' : ''}" id="card-${m.key}" style="border-left-color: ${colors[i]}">
                    <div class="card-header">
                        <div class="ai-label">
                            <div class="ai-badge ${m.badgeClass}">${m.badgeText}</div>
                            ${m.name} <span class="ai-sublabel">· ${m.sub}</span>
                        </div>
                    </div>
                    <div class="thinking-indicator">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            `).join('');
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text);
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy", 2000);
        }

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
        }

        function addToHistory(question) {
            if (!historyList.includes(question)) {
                historyList.unshift(question);
                if (historyList.length > 10) historyList.pop();
            }
            document.getElementById("history").innerHTML = historyList.map(q => `
                <div class="history-item" onclick="askQuestion('${q.replace(/'/g, "\\'")}')">${q}</div>
            `).join('');
        }

        async function askQuestion(q) {
            document.getElementById("question").value = q;
            await ask();
        }

        async function ask() {
            const question = document.getElementById("question").value;
            if (!question.trim()) return;

            document.getElementById("questionDisplay").style.display = "block";
            document.getElementById("questionText").innerText = question;

            showThinkingCards();
            addToHistory(question);

            try {
                const response = await fetch("https://consilium-production-48f1.up.railway.app/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({question: question})
                });

                const data = await response.json();

                for (let i = 0; i < models.length; i++) {
                    const m = models[i];
                    await new Promise(resolve => setTimeout(resolve, i * 400));
                    const card = document.getElementById(`card-${m.key}`);
                    card.style.transition = "opacity 0.4s ease";
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="ai-label">
                                <div class="ai-badge ${m.badgeClass}">${m.badgeText}</div>
                                ${m.name} <span class="ai-sublabel">· ${m.sub}</span>
                            </div>
                            <div class="card-actions">
                                <button class="copy-btn" onclick="copyText(\`${data[m.key].replace(/`/g, '\\`')}\`, this)">Copy</button>
                            </div>
                        </div>
                        <div class="ai-content">${marked.parse(data[m.key])}</div>
                    `;
                }

            } catch (err) {
                document.getElementById("answer").innerHTML = `
                    <div class="ai-card" style="border-left-color: #ff4a4a">
                        <div class="ai-content" style="color: rgba(255,100,100,0.8)">
                            Something went wrong. Please try again.
                        </div>
                    </div>
                `;
            }
        }

        document.getElementById("question").addEventListener("keydown", function(e) {
            if (e.key === "Enter") ask();
        });

        renderWaitingCards();
    </script>
</body>
</html>
